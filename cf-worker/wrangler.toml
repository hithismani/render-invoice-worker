# PDF API worker. Cloudflare dashboard Root directory must be `cf-worker`
# (or this folder). Deploy command: pnpm install && pnpm exec wrangler deploy
# Do not run wrangler from the parent repo root - there is no worker entry there.
name = "renderinvoice"
main = "src/worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Persist console logs to Workers Logs (dashboard, 3-day retention on free plan).
# Levels map from console methods: log→info, warn→warn, error→error.
[observability]
enabled = true
head_sampling_rate = 1

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

# Required: npx wrangler secret put API_KEY_SECRET
#
# Optional vars (wrangler.toml [vars] or dashboard):
#   PLAYGROUND_URL  — PDF edit-link base. Unset → https://renderinvoice.com/playground
#                     Set to your site origin (https://example.com) or full
#                     playground path (https://example.com/playground).
#   ALLOWED_IPS     — comma-separated client IPs (CF-Connecting-IP)
